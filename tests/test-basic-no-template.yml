name: Test basic usage - parse issue body without template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### The Name of the Thing

            this-thing

            ### The Nickname of the Thing

            thing

            ### The Color of the Thing

            blue
          workspace: ${{ github.workspace }}

      - name: Assert JSON output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty JSON output"
            exit 1
          fi
          echo "PASS: JSON output is non-empty"

      - name: Assert JSON contains the_name_of_the_thing key
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "the_name_of_the_thing"; then
            echo "FAIL: expected 'the_name_of_the_thing' key in JSON output"
            exit 1
          fi
          echo "PASS: 'the_name_of_the_thing' key found"

      - name: Assert JSON contains correct value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "this-thing"; then
            echo "FAIL: expected 'this-thing' value in JSON output"
            exit 1
          fi
          echo "PASS: 'this-thing' value found"

      - name: Assert JSON is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin)"; then
            echo "FAIL: output is not valid JSON"
            exit 1
          fi
          echo "PASS: output is valid JSON"
