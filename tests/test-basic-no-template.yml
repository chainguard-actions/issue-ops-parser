name: Test basic parsing without template
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### Project Name

            my-awesome-project

            ### Environment

            production

            ### Description

            This is a test description.
          workspace: ${{ github.workspace }}

      - name: Assert json output is non-empty
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUT"
          if [ -z "$JSON_OUT" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          echo "PASS: json output is non-empty"

      - name: Assert project_name key is present and correct
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUT"
          VALUE=$(echo "$JSON_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('project_name',''))")
          echo "project_name: $VALUE"
          if [ "$VALUE" != "my-awesome-project" ]; then
            echo "FAIL: expected project_name='my-awesome-project', got '$VALUE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert environment key is present and correct
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          VALUE=$(echo "$JSON_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('environment',''))")
          echo "environment: $VALUE"
          if [ "$VALUE" != "production" ]; then
            echo "FAIL: expected environment='production', got '$VALUE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert description key is present and correct
        env:
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          VALUE=$(echo "$JSON_OUT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('description',''))")
          echo "description: $VALUE"
          if [ "$VALUE" != "This is a test description." ]; then
            echo "FAIL: expected description='This is a test description.', got '$VALUE'"
            exit 1
          fi
          echo "PASS"
