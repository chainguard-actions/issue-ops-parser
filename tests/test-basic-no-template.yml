name: Test basic usage - parse issue body without template
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### Project Name

            my-project

            ### Description

            This is a test description.
          workspace: ${{ github.workspace }}

      - name: Assert json output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty json output"
            exit 1
          fi
          echo "PASS: json output is non-empty"

      - name: Assert json output contains expected key
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          # The action slugifies headings, so "Project Name" becomes "project_name"
          if ! echo "$ACTUAL" | grep -q "project_name"; then
            echo "FAIL: expected 'project_name' key in json output"
            exit 1
          fi
          echo "PASS: json output contains 'project_name' key"

      - name: Assert json output contains expected value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "my-project"; then
            echo "FAIL: expected 'my-project' value in json output"
            exit 1
          fi
          echo "PASS: json output contains 'my-project' value"

      - name: Assert parsed output for project_name
        env:
          ACTUAL: ${{ steps.action.outputs.parsed_project_name }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "my-project" ]; then
            echo "FAIL: expected 'my-project' but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: parsed_project_name is 'my-project'"
