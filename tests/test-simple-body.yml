name: Test simple issue body parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### Repository Name

            my-new-repo

            ### Description

            A simple repository for testing.

            ### Visibility

            public
          workspace: ${{ github.workspace }}

      - name: Assert JSON output is valid JSON
        env:
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          if [ -z "$JSON_OUTPUT" ]; then
            echo "FAIL: expected non-empty JSON output"
            exit 1
          fi
          echo "$JSON_OUTPUT" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: output is not valid JSON"
            exit 1
          }
          echo "PASS: output is valid JSON"

      - name: Assert repository name field is present
        env:
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          REPO=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('repository_name',''))")
          echo "repository_name: $REPO"
          if [ "$REPO" != "my-new-repo" ]; then
            echo "FAIL: expected 'my-new-repo', got '$REPO'"
            exit 1
          fi
          echo "PASS"

      - name: Assert description field is present
        env:
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          DESC=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('description',''))")
          echo "description: $DESC"
          if [ "$DESC" != "A simple repository for testing." ]; then
            echo "FAIL: expected 'A simple repository for testing.', got '$DESC'"
            exit 1
          fi
          echo "PASS"

      - name: Assert visibility field is present
        env:
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          VIS=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('visibility',''))")
          echo "visibility: $VIS"
          if [ "$VIS" != "public" ]; then
            echo "FAIL: expected 'public', got '$VIS'"
            exit 1
          fi
          echo "PASS"
