name: Test complex issue body parsing without template
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### Title

            my-title

            ### Notes

            _No response_

            ### Tags

            alpha, beta, gamma
          workspace: ${{ github.workspace }}

      - name: Assert json output is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty json output"
            exit 1
          fi
          # Validate it's parseable JSON
          echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin)" || {
            echo "FAIL: output is not valid JSON"
            exit 1
          }
          echo "PASS: json output is valid JSON"

      - name: Assert title field is parsed correctly
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          TITLE=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('title', ''))")
          echo "title: $TITLE"
          if [ "$TITLE" != "my-title" ]; then
            echo "FAIL: expected title 'my-title' but got '$TITLE'"
            exit 1
          fi
          echo "PASS: title field is 'my-title'"

      - name: Assert no-response field is preserved
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "No response"; then
            echo "FAIL: expected '_No response_' to be preserved in output"
            exit 1
          fi
          echo "PASS: no-response field is preserved"

      - name: Assert tags field contains expected value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "alpha"; then
            echo "FAIL: expected 'alpha' in tags field"
            exit 1
          fi
          echo "PASS: tags field contains 'alpha'"
