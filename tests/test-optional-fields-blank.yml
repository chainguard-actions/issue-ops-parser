name: Test optional fields left blank
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: parser
        uses: .
        with:
          body: |
            ### Name

            my-thing

            ### Description

            _No response_

            ### Color

            red

            ### Confirmation

            - [x] I confirm this request
          issue-form-template: simple-request.yml
          workspace: ${{ github.workspace }}/tests/fixtures

      - name: Assert json output is not empty
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          if [ -z "$JSON_OUTPUT" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          echo "PASS: json output is not empty"

      - name: Assert name field is present
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          NAME=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('name', ''))")
          echo "name: $NAME"
          if [ "$NAME" != "my-thing" ]; then
            echo "FAIL: expected name='my-thing', got '$NAME'"
            exit 1
          fi
          echo "PASS: name field parsed correctly"

      - name: Assert optional description field is empty string or null
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          # When _No response_ is provided, the field should be empty string or absent
          DESCRIPTION=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(repr(d.get('description', '')))")
          echo "description: $DESCRIPTION"
          # Accept empty string or None/null
          if [ "$DESCRIPTION" != "''" ] && [ "$DESCRIPTION" != "None" ] && [ "$DESCRIPTION" != "null" ]; then
            echo "FAIL: expected description to be empty or null, got '$DESCRIPTION'"
            exit 1
          fi
          echo "PASS: optional description field is empty when _No response_ provided"

      - name: Assert color is red
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          COLOR=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('color', []))")
          echo "color: $COLOR"
          if [ "$COLOR" != "['red']" ]; then
            echo "FAIL: expected color=['red'], got '$COLOR'"
            exit 1
          fi
          echo "PASS: color field parsed correctly"
