name: Test basic issue parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: parser
        uses: .
        with:
          body: |
            ### Name

            my-awesome-thing

            ### Description

            This is a description of the thing.

            ### Color

            blue

            ### Confirmation

            - [x] I confirm this request
          issue-form-template: simple-request.yml
          workspace: ${{ github.workspace }}/tests/fixtures

      - name: Assert json output is not empty
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          if [ -z "$JSON_OUTPUT" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          echo "PASS: json output is not empty"

      - name: Assert name field is parsed correctly
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          NAME=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('name', ''))")
          echo "name: $NAME"
          if [ "$NAME" != "my-awesome-thing" ]; then
            echo "FAIL: expected name='my-awesome-thing', got '$NAME'"
            exit 1
          fi
          echo "PASS: name field parsed correctly"

      - name: Assert color field is parsed as array
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          COLOR=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('color', []))")
          echo "color: $COLOR"
          if [ "$COLOR" != "['blue']" ]; then
            echo "FAIL: expected color=['blue'], got '$COLOR'"
            exit 1
          fi
          echo "PASS: color field parsed as array"

      - name: Assert confirm checkboxes are parsed
        env:
          JSON_OUTPUT: ${{ steps.parser.outputs.json }}
        run: |
          echo "json output: $JSON_OUTPUT"
          SELECTED=$(echo "$JSON_OUTPUT" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('confirm', {}).get('selected', []))")
          echo "confirm selected: $SELECTED"
          if [ "$SELECTED" != "['I confirm this request']" ]; then
            echo "FAIL: expected confirm.selected=['I confirm this request'], got '$SELECTED'"
            exit 1
          fi
          echo "PASS: confirm checkboxes parsed correctly"
