name: Test basic issue form parsing
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: parse
        uses: .
        with:
          body: |
            ### Name

            my-awesome-thing

            ### Description

            This is a great description.

            ### Color

            blue

            ### Confirmation

            - [x] I confirm this request
            - [x] I understand the process
          issue-form-template: simple-request.yml
          workspace: ${{ github.workspace }}/tests/fixtures/templates

      - name: Assert json output is non-empty
        env:
          ACTUAL: ${{ steps.parse.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty JSON output"
            exit 1
          fi
          echo "PASS: json output is non-empty"

      - name: Assert name field parsed correctly
        env:
          ACTUAL: ${{ steps.parse.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          NAME=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('name',''))")
          echo "name: $NAME"
          if [ "$NAME" != "my-awesome-thing" ]; then
            echo "FAIL: expected name='my-awesome-thing', got '$NAME'"
            exit 1
          fi
          echo "PASS: name field parsed correctly"

      - name: Assert color field is an array containing blue
        env:
          ACTUAL: ${{ steps.parse.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          # color is a dropdown, always returned as array
          COLOR_JSON=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(json.dumps(d.get('color', [])))")
          echo "color json: $COLOR_JSON"
          if echo "$COLOR_JSON" | python3 -c "import sys, json; lst=json.load(sys.stdin); exit(0 if 'blue' in lst else 1)"; then
            echo "PASS: color contains 'blue'"
          else
            echo "FAIL: expected color to contain 'blue', got '$COLOR_JSON'"
            exit 1
          fi

      - name: Assert checkboxes parsed correctly
        env:
          ACTUAL: ${{ steps.parse.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          SELECTED=$(echo "$ACTUAL" | python3 -c "import sys, json; d=json.load(sys.stdin); print(json.dumps(d.get('confirm', {}).get('selected', [])))")
          echo "confirm selected: $SELECTED"
          if echo "$SELECTED" | python3 -c "import sys, json; lst=json.load(sys.stdin); exit(0 if any('I confirm this request' in s for s in lst) else 1)"; then
            echo "PASS: checkbox selected field parsed correctly"
          else
            echo "FAIL: expected 'I confirm this request' in selected, got '$SELECTED'"
            exit 1
          fi

      - name: Assert output is valid JSON
        env:
          ACTUAL: ${{ steps.parse.outputs.json }}
        run: |
          echo "actual json: $ACTUAL"
          echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin); print('PASS: valid JSON')" || {
            echo "FAIL: output is not valid JSON"
            exit 1
          }
