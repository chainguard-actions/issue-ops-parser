name: Test - Parse Issue Body With No Response Fields
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          body: |
            ### Required Field

            some-value

            ### Optional Field

            _No response_
          workspace: ${{ github.workspace }}

      - name: Assert json output is not empty
        env:
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "json: $JSON"
          if [ -z "$JSON" ]; then
            echo "FAIL: json output is empty"
            exit 1
          fi
          echo "PASS: json output is not empty"

      - name: Assert required field is parsed correctly
        env:
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "json: $JSON"
          VALUE=$(echo "$JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('required_field',''))")
          echo "required_field: $VALUE"
          if [ "$VALUE" != "some-value" ]; then
            echo "FAIL: expected 'some-value', got '$VALUE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert no-response field is preserved
        env:
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "json: $JSON"
          VALUE=$(echo "$JSON" | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('optional_field',''))")
          echo "optional_field: $VALUE"
          if [ "$VALUE" != "_No response_" ]; then
            echo "FAIL: expected '_No response_', got '$VALUE'"
            exit 1
          fi
          echo "PASS"

      - name: Assert output is valid JSON
        env:
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "json: $JSON"
          echo "$JSON" | python3 -m json.tool > /dev/null
          if [ $? -ne 0 ]; then
            echo "FAIL: output is not valid JSON"
            exit 1
          fi
          echo "PASS: output is valid JSON"
