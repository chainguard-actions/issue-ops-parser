name: Test parse issue body with issue form template
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up issue form template from committed fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE"
          cp "$GITHUB_WORKSPACE/tests/fixtures/.github/ISSUE_TEMPLATE/new-repository.yml" \
             "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE/new-repository.yml"

      - id: action
        uses: .
        with:
          body: |
            ### Repository Name

            my-new-repo

            ### Visibility

            public

            ### Description

            A test repository for CI.

            ### Confirm

            - [x] I confirm this request is valid
          issue-form-template: new-repository.yml
          workspace: ${{ github.workspace }}

      - name: Assert JSON output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty JSON output"
            exit 1
          fi
          echo "PASS: JSON output is non-empty"

      - name: Assert JSON contains repo-name key (template id)
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "repo-name"; then
            echo "FAIL: expected 'repo-name' key in JSON output (template id)"
            exit 1
          fi
          echo "PASS: 'repo-name' key found"

      - name: Assert JSON contains correct repo name value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "my-new-repo"; then
            echo "FAIL: expected 'my-new-repo' value in JSON output"
            exit 1
          fi
          echo "PASS: 'my-new-repo' value found"

      - name: Assert visibility is an array (dropdown with template)
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          # With a template, dropdown values become arrays
          echo "$ACTUAL" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          visibility = data.get('visibility', None)
          if not isinstance(visibility, list):
              print(f'FAIL: expected visibility to be a list, got {type(visibility).__name__}: {visibility}')
              sys.exit(1)
          if 'public' not in visibility:
              print(f'FAIL: expected public in visibility list, got {visibility}')
              sys.exit(1)
          print('PASS: visibility is a list containing public')
          "

      - name: Assert JSON is valid JSON
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | python3 -c "import sys, json; json.load(sys.stdin)"; then
            echo "FAIL: output is not valid JSON"
            exit 1
          fi
          echo "PASS: output is valid JSON"
