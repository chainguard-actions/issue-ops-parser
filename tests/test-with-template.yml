name: Test parse issue body with issue form template
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up issue template fixture
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE"
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/.github/ISSUE_TEMPLATE/test-template.yml" \
            "$GITHUB_WORKSPACE/.github/ISSUE_TEMPLATE/test-template.yml"

      - id: action
        uses: .
        with:
          body: |
            ### Project Name

            my-project

            ### Description

            This is a test description.

            ### Environment

            staging

            ### Confirmation

            - [x] I confirm this request
          issue-form-template: test-template.yml
          workspace: ${{ github.workspace }}

      - name: Assert json output is non-empty
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "FAIL: expected non-empty json output"
            exit 1
          fi
          echo "PASS: json output is non-empty"

      - name: Assert json output uses template IDs as keys
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          # When using a template, the action uses the template field IDs as keys
          if ! echo "$ACTUAL" | grep -q "project-name"; then
            echo "FAIL: expected 'project-name' key (template ID) in json output"
            exit 1
          fi
          echo "PASS: json output contains 'project-name' key"

      - name: Assert json output contains project name value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "my-project"; then
            echo "FAIL: expected 'my-project' value in json output"
            exit 1
          fi
          echo "PASS: json output contains 'my-project' value"

      - name: Assert json output contains environment value
        env:
          ACTUAL: ${{ steps.action.outputs.json }}
        run: |
          echo "actual: $ACTUAL"
          if ! echo "$ACTUAL" | grep -q "staging"; then
            echo "FAIL: expected 'staging' value in json output"
            exit 1
          fi
          echo "PASS: json output contains 'staging' value"
